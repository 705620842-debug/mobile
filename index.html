    </div>

    </div>
  </div>

</div>

/* ================= 全局变量 ================= */
let currentSeries = 'M20';
let currentList = [...allCars.M20];

/* ================= 系列切换 ================= */
function switchSeries(series) {
  currentSeries = series;
  currentList = [...allCars[series]];
  renderOptions();
  renderList();

  document.querySelectorAll('.series-tab button').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.series-tab button[onclick*="${series}"]`).classList.add('active');
}

/* ================= 选装项渲染 ================= */
function renderOptions() {
  const container = document.getElementById('opt_container');
  container.innerHTML = '';
  optionSets[currentSeries].forEach((opt, i) => {
    container.innerHTML += `
      <div class="checkbox">
        <input type="checkbox" id="opt_${i}" data-price="${opt.price}" onchange="calcTotal()">
        <span>${opt.name} ${opt.price > 0 ? '+' + opt.price.toLocaleString() : opt.price < 0 ? opt.price.toLocaleString() : ''}</span>
      </div>
    `;
  });
}

/* ================= 互斥逻辑 ================= */
const map = {
  heat: 'f_heat',
  winch: 'f_winch',
  gen: 'f_gen',
  esc: 'f_esc',
  center: 'f_center',
  night: 'f_night',
  fcw: 'f_fcw',
  wade: 'f_wade'
};

function toggleOption(type, checked) {
  const optEls = document.querySelectorAll('#opt_container input');
  if (currentList.length === 1) {
    const car = currentList[0];
    optEls.forEach(el => {
      if (el.id.includes(type)) el.disabled = car[type] === 1;
    });
  }
  calcTotal();
}

/* ================= 计算总价 ================= */
function calcTotal() {
  let total = 0;
  document.querySelectorAll('#opt_container input:checked').forEach(el => {
    if (!el.disabled) total += +el.dataset.price;
  });
  document.getElementById('opt_total').innerText = total.toLocaleString();
  renderList();
}

/* ================= 渲染车型列表 ================= */
function renderList() {
  const optTotal = +document.getElementById('opt_total').innerText.replace(/,/g, '') || 0;
  const dom = document.getElementById('list');
  if (currentList.length === 0) {
    dom.innerHTML = '<div class="empty">暂无匹配车型</div>';
    return;
  }

  let html = '';
  currentList.forEach((car, index) => {
    const basePrice = typeof car.price === 'number' ? car.price : 0;
    const finalPrice = basePrice + optTotal;
    const priceDisplay = typeof car.price === 'number' ? `${car.price.toLocaleString()} 元` : car.price;
    const finalDisplay = typeof car.price === 'number' ? `${finalPrice.toLocaleString()} 元` : '价格待公布';

    html += `
      <div class="car-card" onclick="openModal(currentList[${index}])">
        <h4>${car.model}</h4>
        <div class="info">${car.type}｜${car.cab}｜${car.tire}</div>
        <div class="price">基础价：${priceDisplay}</div>
        <div class="final">最终价：${finalDisplay}</div>
        <div style="margin-top:8px">
          ${car.heat ? '<span class="label">燃油加热</span>' : ''}
          ${car.winch ? '<span class="label">绞盘</span>' : ''}
          ${car.gen ? '<span class="label">双发电机</span>' : ''}
          ${car.esc ? '<span class="label">ESC</span>' : ''}
          ${car.center ? '<span class="label label-center">中央充放气</span>' : ''}
          ${car.night ? '<span class="label">夜视</span>' : ''}
          ${car.fcw ? '<span class="label">碰撞预警</span>' : ''}
          ${car.wade ? '<span class="label">涉水</span>' : ''}
        </div>
      </div>
    `;
  });
  dom.innerHTML = html;

  if (currentList.length === 1) syncOptions(currentList[0]);
}

/* ================= 同步已标配 ================= */
function syncOptions(car) {
  Object.keys(map).forEach(type => {
    document.getElementById(map[type]).checked = car[type] === 1;
    document.querySelectorAll('#opt_container input').forEach(el => {
      if (el.id.includes(type)) el.disabled = car[type] === 1;
    });
  });
}

/* ================= 筛选车型 ================= */
function search() {
  const f = {
    chassis: document.getElementById('f_chassis').checked,
    whole: document.getElementById('f_whole').checked,
    cab1: document.getElementById('f_cab1').checked,
    cab2: document.getElementById('f_cab2').checked,
    cab3: document.getElementById('f_cab3').checked,
    heat: document.getElementById('f_heat').checked,
    winch: document.getElementById('f_winch').checked,
    gen: document.getElementById('f_gen').checked,
    esc: document.getElementById('f_esc').checked,
    center: document.getElementById('f_center').checked,
    night: document.getElementById('f_night').checked,
    fcw: document.getElementById('f_fcw').checked,
    wade: document.getElementById('f_wade').checked
  };

  currentList = allCars[currentSeries].filter(x => {
    if (f.chassis && x.type !== '底盘') return false;
    if (f.whole && x.type !== '整车') return false;
    if (f.cab1 && x.cab !== '单排') return false;
    if (f.cab2 && x.cab !== '双排') return false;
    if (f.cab3 && x.cab !== '双（5座）') return false;
    if (f.heat && x.heat !== 1) return false;
    if (f.winch && x.winch !== 1) return false;
    if (f.gen && x.gen !== 1) return false;
    if (f.esc && x.esc !== 1) return false;
    if (f.center && x.center !== 1) return false;
    if (f.night && x.night !== 1) return false;
    if (f.fcw && x.fcw !== 1) return false;
    if (f.wade && x.wade !== 1) return false;
    return true;
  });

  renderList();
}

/* ================= 重置 ================= */
function resetAll() {
  document.querySelectorAll('input').forEach(el => {
    el.checked = false;
    el.disabled = false;
  });
  document.getElementById('opt_total').innerText = '0';
  currentList = [...allCars[currentSeries]];
  renderList();
}

/* ================= 弹窗 ================= */
function openModal(car) {
  const priceDisplay = typeof car.price === 'number' ? `${car.price.toLocaleString()} 元` : car.price;
  document.getElementById('modalBody').innerHTML = `
    <h2>${car.model}</h2>
    <div class="modal-line"><b>类型：</b>${car.type}</div>
    <div class="modal-line"><b>驾驶室：</b>${car.cab}</div>
    <div class="modal-line"><b>轮胎：</b>${car.tire}</div>
    <div class="modal-line"><b>基础价：</b>${priceDisplay}</div>
    <div class="modal-title">📋 标准配置</div>
    <div style="white-space:pre-line; background:#f8f9fa; padding:12px; border-radius:6px;">${car.content}</div>
  `;
  document.getElementById('carModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('carModal').style.display = 'none';
}

/* ================= 初始化 ================= */
window.onload = () => {
  renderOptions();
  renderList();
};
